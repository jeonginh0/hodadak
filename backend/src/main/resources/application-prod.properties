# =====================================================================
# prod: Oracle VM k3s 운영
# 모든 값은 환경 변수(쿠버네티스 Secret, SPEC 15.8)에서 받는다.
# 기본값 없이 ${...} 로 쓰면 값이 빠졌을 때 앱이 시작 단계에서 실패한다 (의도된 동작).
# =====================================================================
# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 파드당 5개 (SPEC 15.4)
spring.datasource.hikari.maximum-pool-size=5

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ---------- 오브젝트 스토리지 ----------
hodadak.storage.endpoint=${STORAGE_ENDPOINT}
hodadak.storage.bucket=${STORAGE_BUCKET}
hodadak.storage.access-key=${STORAGE_ACCESS_KEY}
hodadak.storage.secret-key=${STORAGE_SECRET_KEY}

# ---------- JWT ----------
hodadak.jwt.access-secret=${JWT_ACCESS_SECRET}
hodadak.jwt.ticket-secret=${JWT_TICKET_SECRET}

# ---------- 카카오 로그인 ----------
hodadak.kakao.client-id=${KAKAO_CLIENT_ID}
hodadak.kakao.client-secret=${KAKAO_CLIENT_SECRET}
hodadak.kakao.redirect-uri=${PUBLIC_BASE_URL}/auth/kakao/callback

# ---------- 서비스 주소 ----------
hodadak.public-base-url=${PUBLIC_BASE_URL}

# ---------- Ingress(Traefik) 뒤에서 원래 https 주소를 인식 ----------
server.forward-headers-strategy=framework

# ---------- 로그: JSON 형식 (여러 파드 로그를 모아 보기 쉽게) ----------
logging.structured.format.console=ecs
logging.level.com.hodadak=info