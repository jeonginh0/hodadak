# =====================================================================
# 공통 설정: 모든 환경(local, prod), 모든 역할(api, worker)에 적용
# 환경별 값은 application-local / application-prod 에서 덮어쓴다.
# 주의: 이 파일에 spring.profiles.active 를 적지 않는다 (실행할 때 지정)
# =====================================================================

spring.application.name=hodadak

# ---------- JPA ----------
# 스키마는 Flyway가 만들고 JPA는 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
# api, worker 둘 다 켜 둔다. 동시에 떠도 Flyway가 DB 락을 잡아 한 번만 적용한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Redis ----------
spring.data.redis.timeout=2s

# ---------- 종료 (롤링 배포 시 요청 유실 방지, SPEC 15.4) ----------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Actuator (쿠버네티스 프로브, 메트릭) ----------
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,prometheus

# ---------- OpenAPI 문서 ----------
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui

# ---------- 이미지 업로드 (SPEC 9.6, 최대 5MB) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Kafka 토픽 이름 (SPEC 10.1) ----------
hodadak.kafka.topic.seat-released=hodadak.seat-released
hodadak.kafka.topic.application-confirmed=hodadak.application-confirmed

# ---------- 호다닥 기본 설정값 (SPEC 5.5) ----------
hodadak.offer.window-minutes=30
hodadak.queue.admit-per-second=200
hodadak.queue.admission-ttl-seconds=60
hodadak.queue.poll-interval-ms=2000
hodadak.checkin.early-minutes=30
hodadak.jwt.access-ttl-minutes=30
hodadak.jwt.refresh-ttl-days=14