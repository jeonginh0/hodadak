# =====================================================================
# api: HTTP 요청 처리 역할 (운영에서 2~3개)
# 실행 예: 운영 prod,api / 로컬 실습 local,api
#
# 역할 구분은 주로 코드의 @Profile 로 한다.
#  - 스케줄 잡, Outbox 릴레이, Kafka 리스너, Redis 재구성 빈에는 @Profile("worker")
#  - 그래서 api로 실행하면 그 빈들이 아예 만들어지지 않는다.
# 이 파일에는 api에만 해당하는 튜닝 값을 둔다.
# =====================================================================

# 요청 처리 스레드 (2 OCPU 기준 초기값, 부하 테스트 후 조정)
server.tomcat.threads.max=100
server.tomcat.accept-count=200