# =====================================================================
# local: 각자 노트북 (infra/docker-compose.yml 의 값과 맞춘다)
# 실행 예: --spring.profiles.active=local,api,worker
# 진짜 비밀값(카카오 키)은 여기 적지 않고 환경 변수로 넘긴다.
# =====================================================================

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/hodadak
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092

# ---------- 오브젝트 스토리지 (제품 결정 후 포트 맞추기) ----------
hodadak.storage.endpoint=http://localhost:8333
hodadak.storage.bucket=hodadak-images
hodadak.storage.access-key=local-access-key
hodadak.storage.secret-key=local-secret-key

# ---------- JWT (로컬 전용 가짜 키, HS256은 32바이트 이상) ----------
hodadak.jwt.access-secret=local-only-access-secret-0123456789abcdef
hodadak.jwt.ticket-secret=local-only-ticket-secret-0123456789abcdef

# ---------- 카카오 로그인 (값은 환경 변수로, 없으면 빈 값) ----------
hodadak.kakao.client-id=${KAKAO_CLIENT_ID:}
hodadak.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
hodadak.kakao.redirect-uri=http://localhost:3000/auth/kakao/callback

# ---------- 서비스 주소 (OG 태그, 이미지 URL) ----------
hodadak.public-base-url=http://localhost:3000

# ---------- 로그 ----------
logging.level.com.hodadak=debug
logging.level.org.hibernate.SQL=debug